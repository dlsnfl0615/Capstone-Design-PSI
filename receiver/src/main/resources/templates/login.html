<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Privacy-Preserving Medical Verification - Login</title>
    <style>
        :root {
            --bg: #f5f7fb;
            --surface: #ffffff;
            --surface-soft: #f8fafc;
            --text: #121826;
            --muted: #667085;
            --muted-2: #98a2b3;
            --line: #e4e7ec;
            --primary: #1457d9;
            --primary-dark: #0f46b5;
            --primary-soft: #eef4ff;
            --success: #07885f;
            --shadow: 0 22px 70px rgba(15, 23, 42, 0.08);
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            color: var(--text);
            background: radial-gradient(circle at 18% 18%, rgba(20, 87, 217, 0.08), transparent 26%),
            radial-gradient(circle at 82% 76%, rgba(7, 136, 95, 0.06), transparent 28%),
            var(--bg);
            display: grid;
            place-items: center;
            padding: 40px 20px;
        }

        .page {
            width: min(100%, 440px);
            animation: enter 560ms cubic-bezier(.22, 1, .36, 1) both;
        }

        .brand {
            text-align: center;
            margin-bottom: 28px;
        }

        .symbol {
            width: 58px;
            height: 58px;
            border-radius: 18px;
            display: inline-grid;
            place-items: center;
            background: linear-gradient(145deg, #ffffff, #edf3ff);
            border: 1px solid rgba(20, 87, 217, 0.14);
            box-shadow: 0 14px 36px rgba(20, 87, 217, 0.14);
            margin-bottom: 18px;
        }

        .symbol svg {
            width: 32px;
            height: 32px;
        }

        h1 {
            margin: 0;
            font-size: 28px;
            line-height: 1.18;
            letter-spacing: -0.035em;
            font-weight: 760;
        }

        .subtitle {
            margin: 11px 0 0;
            color: var(--muted);
            font-size: 15px;
            line-height: 1.6;
            letter-spacing: -0.01em;
        }

        .card {
            background: rgba(255, 255, 255, 0.88);
            backdrop-filter: blur(18px);
            border: 1px solid rgba(228, 231, 236, 0.9);
            border-radius: 26px;
            box-shadow: var(--shadow);
            padding: 30px;
        }

        .field + .field {
            margin-top: 18px;
        }

        label {
            display: block;
            margin: 0 0 8px 2px;
            color: #344054;
            font-size: 13px;
            line-height: 1.3;
            font-weight: 650;
            letter-spacing: -0.005em;
        }

        .input-wrap {
            position: relative;
        }

        input {
            width: 100%;
            height: 52px;
            border: 1px solid var(--line);
            border-radius: 14px;
            background: var(--surface-soft);
            color: var(--text);
            padding: 0 46px 0 15px;
            font-size: 15px;
            outline: none;
            transition: border-color 160ms ease, box-shadow 160ms ease, background 160ms ease;
        }

        input::placeholder {
            color: var(--muted-2);
        }

        input:focus {
            background: #fff;
            border-color: rgba(20, 87, 217, 0.72);
            box-shadow: 0 0 0 4px rgba(20, 87, 217, 0.10);
        }

        .input-icon {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            width: 20px;
            height: 20px;
            color: var(--muted-2);
            pointer-events: none;
        }

        .row {
            display: flex;
            justify-content: flex-end;
            margin-top: 12px;
        }

        a {
            color: var(--muted);
            text-decoration: none;
            font-size: 13px;
            font-weight: 620;
            transition: color 150ms ease;
        }

        a:hover {
            color: var(--primary);
        }

        .login-btn {
            width: 100%;
            height: 54px;
            border: 0;
            border-radius: 15px;
            margin-top: 24px;
            background: var(--primary);
            color: white;
            font-size: 16px;
            font-weight: 760;
            letter-spacing: -0.01em;
            cursor: pointer;
            box-shadow: 0 12px 24px rgba(20, 87, 217, 0.22);
            transition: transform 120ms ease, background 160ms ease, box-shadow 160ms ease;
        }

        .login-btn:hover {
            background: var(--primary-dark);
            box-shadow: 0 14px 28px rgba(20, 87, 217, 0.26);
        }

        .login-btn:active {
            transform: translateY(1px) scale(0.99);
        }

        .signup {
            margin-top: 18px;
            text-align: center;
            color: var(--muted);
            font-size: 14px;
        }

        .signup a {
            color: var(--primary);
            margin-left: 4px;
        }

        .trust {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 9px;
            width: fit-content;
            margin: 22px auto 0;
            padding: 8px 13px;
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.72);
            border: 1px solid rgba(228, 231, 236, 0.9);
            box-shadow: 0 8px 24px rgba(15, 23, 42, 0.04);
            color: #475467;
            font-size: 12px;
            font-weight: 680;
        }

        .trust-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--success);
            box-shadow: 0 0 0 4px rgba(7, 136, 95, 0.10);
        }

        .security-note {
            margin: 13px auto 0;
            color: var(--muted-2);
            text-align: center;
            font-size: 12px;
            line-height: 1.5;
        }

        @keyframes enter {
            from {
                opacity: 0;
                transform: translateY(18px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 520px) {
            body {
                padding: 28px 16px;
            }

            h1 {
                font-size: 24px;
            }

            .card {
                padding: 24px;
                border-radius: 22px;
            }

            .subtitle {
                font-size: 14px;
            }
        }
    </style>
</head>
<body>
<main class="page" aria-label="로그인 화면">
    <section class="brand">
        <div class="symbol" aria-hidden="true">
            <svg viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M9 10.4C9 8.52 10.52 7 12.4 7h7.2C21.48 7 23 8.52 23 10.4v1.1" stroke="#1457D9"
                      stroke-width="2" stroke-linecap="round"/>
                <rect x="7" y="12" width="18" height="13" rx="4" fill="#EEF4FF" stroke="#1457D9" stroke-width="2"/>
                <path d="M12 18.7l2.4 2.4L20.3 15" stroke="#07885F" stroke-width="2.2" stroke-linecap="round"
                      stroke-linejoin="round"/>
                <circle cx="6" cy="9" r="2" fill="#B8CEFF"/>
                <circle cx="26" cy="22" r="2" fill="#B8CEFF"/>
                <path d="M8 9h3M23 22h3" stroke="#B8CEFF" stroke-width="1.8" stroke-linecap="round"/>
            </svg>
        </div>
        <h1>Privacy-Preserving<br/>Medical Verification</h1>
        <p class="subtitle">의료 데이터 노출 없이 안전하게 검증을 시작하세요.</p>
    </section>

    <section class="card">
        <form onsubmit="event.preventDefault();" aria-label="로그인 폼">
            <div class="field">
                <label for="user-id">아이디</label>
                <div class="input-wrap">
                    <input id="user-id" type="text" placeholder="아이디를 입력하세요" autocomplete="username"/>
                    <svg class="input-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                        <path d="M20 21a8 8 0 0 0-16 0" stroke="currentColor" stroke-width="1.8"
                              stroke-linecap="round"/>
                        <circle cx="12" cy="8" r="4" stroke="currentColor" stroke-width="1.8"/>
                    </svg>
                </div>
            </div>

            <div class="field">
                <label for="user-pw">비밀번호</label>
                <div class="input-wrap">
                    <input id="user-pw" type="password" placeholder="비밀번호를 입력하세요" autocomplete="current-password"/>
                    <svg class="input-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                        <rect x="5" y="10" width="14" height="10" rx="3" stroke="currentColor" stroke-width="1.8"/>
                        <path d="M8 10V7.8A4 4 0 0 1 12 4a4 4 0 0 1 4 3.8V10" stroke="currentColor" stroke-width="1.8"
                              stroke-linecap="round"/>
                    </svg>
                </div>
            </div>

            <div class="row">
                <a href="#">비밀번호 찾기</a>
            </div>

            <button class="login-btn" type="button" th:onclick="|location.href='@{/receiver/home}'|">로그인</button>
            <!--로그인 기능 생략-->

            <p class="signup">계정이 없으신가요?<a href="#">회원가입</a></p>
        </form>
    </section>

    <div class="trust"><span class="trust-dot"></span>Receiver 전용 보안 검증 서비스</div>
    <p class="security-note">All verification requests are processed through encrypted communication.</p>
</main>
</body>
</html>
