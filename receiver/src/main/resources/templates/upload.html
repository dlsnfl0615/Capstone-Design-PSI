<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>의료 데이터 검증 | 파일 업로드</title>
    <style>
        :root {
            --bg: #f6f8fc;
            --surface: #fff;
            --soft: #f9fbff;
            --line: #e1e7f0;
            --line2: #cdd6e6;
            --text: #141a24;
            --muted: #637084;
            --subtle: #8994a6;
            --primary: #1f5eff;
            --primary2: #1648c9;
            --psoft: #edf3ff;
            --green: #0f8b5f;
            --gsoft: #ecfdf6;
            --shadow: 0 18px 45px rgba(20, 26, 36, .07)
        }

        * {
            box-sizing: border-box
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: radial-gradient(circle at 12% 12%, rgba(31, 94, 255, .08), transparent 28%), linear-gradient(180deg, #fbfcff 0%, var(--bg) 100%);
            color: var(--text);
            font-family: Inter, "Noto Sans KR", "Apple SD Gothic Neo", Arial, sans-serif;
            -webkit-font-smoothing: antialiased
        }

        .topbar {
            position: sticky;
            top: 0;
            z-index: 20;
            background: rgba(255, 255, 255, .9);
            backdrop-filter: blur(14px);
            border-bottom: 1px solid rgba(226, 231, 240, .88)
        }

        .topbar-inner {
            max-width: 1080px;
            height: 68px;
            margin: 0 auto;
            padding: 0 28px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 18px
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 800;
            letter-spacing: -.02em;
            color: #10203d
        }

        .brand-mark {
            width: 34px;
            height: 34px;
            border-radius: 12px;
            display: grid;
            place-items: center;
            color: var(--primary);
            background: var(--psoft);
            border: 1px solid #dbe6ff
        }

        .brand-mark:before {
            content: "⌁";
            font-size: 22px;
            font-weight: 800
        }

        .user-area {
            display: flex;
            align-items: center;
            gap: 14px;
            color: var(--muted);
            font-size: 14px;
            white-space: nowrap
        }

        .logout {
            border: 1px solid var(--line);
            background: #fff;
            color: var(--muted);
            height: 36px;
            padding: 0 14px;
            border-radius: 999px;
            font: inherit;
            cursor: pointer
        }

        .page {
            max-width: 1080px;
            margin: 0 auto;
            padding: 54px 28px 36px
        }

        .hero {
            display: grid;
            grid-template-columns:1.05fr .95fr;
            align-items: center;
            gap: 42px;
            margin-bottom: 28px
        }

        .eyebrow {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 7px 12px;
            border-radius: 999px;
            background: var(--psoft);
            color: var(--primary2);
            font-size: 13px;
            font-weight: 800;
            margin-bottom: 18px
        }

        .eyebrow:before {
            content: "✓";
            width: 18px;
            height: 18px;
            border-radius: 50%;
            display: grid;
            place-items: center;
            background: #fff
        }

        h1 {
            margin: 0;
            font-size: clamp(30px, 4vw, 46px);
            line-height: 1.16;
            letter-spacing: -.045em
        }

        .lead {
            margin: 18px 0 0;
            max-width: 560px;
            color: var(--muted);
            font-size: 17px;
            line-height: 1.75;
            letter-spacing: -.01em
        }

        .meta-row {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 24px
        }

        .pill {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            height: 34px;
            padding: 0 12px;
            border-radius: 999px;
            background: #fff;
            border: 1px solid var(--line);
            color: var(--muted);
            font-size: 13px;
            font-weight: 700
        }

        .pill i {
            font-style: normal;
            color: var(--primary)
        }

        .upload-card {
            background: var(--surface);
            border: 1px solid var(--line);
            border-radius: 28px;
            box-shadow: var(--shadow);
            padding: 24px
        }

        .upload-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 14px;
            margin-bottom: 18px
        }

        .upload-title {
            display: flex;
            align-items: center;
            gap: 12px
        }

        .upload-icon {
            width: 42px;
            height: 42px;
            border-radius: 15px;
            display: grid;
            place-items: center;
            color: var(--primary);
            background: var(--psoft);
            border: 1px solid #dbe6ff
        }

        .upload-icon:before {
            content: "↑";
            font-size: 24px;
            font-weight: 700
        }

        .upload-title h2 {
            margin: 0;
            font-size: 18px;
            letter-spacing: -.02em
        }

        .upload-title p {
            margin: 3px 0 0;
            color: var(--subtle);
            font-size: 13px
        }

        .status-badge {
            height: 30px;
            padding: 0 10px;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            border-radius: 999px;
            background: var(--gsoft);
            color: var(--green);
            font-size: 12px;
            font-weight: 800;
            white-space: nowrap
        }

        .dropzone {
            position: relative;
            min-height: 254px;
            border: 1.5px dashed var(--line2);
            border-radius: 24px;
            background: var(--soft);
            display: grid;
            place-items: center;
            padding: 34px 24px;
            text-align: center;
            cursor: pointer;
            transition: .2s ease
        }

        .dropzone:hover, .dropzone.dragover {
            border-color: var(--primary);
            background: #f4f8ff
        }

        .drop-symbol {
            width: 72px;
            height: 72px;
            margin: 0 auto 18px;
            border-radius: 24px;
            display: grid;
            place-items: center;
            color: var(--primary);
            background: #fff;
            border: 1px solid var(--line);
            box-shadow: 0 10px 26px rgba(31, 94, 255, .08)
        }

        .drop-symbol:before {
            content: "CSV";
            font-size: 18px;
            font-weight: 900;
            letter-spacing: -.04em
        }

        .dropzone strong {
            display: block;
            font-size: 20px;
            letter-spacing: -.025em;
            margin-bottom: 7px
        }

        .dropzone small {
            color: var(--muted);
            font-size: 14px;
            line-height: 1.55
        }

        .button-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-top: 22px;
            flex-wrap: wrap
        }

        .primary-btn, .secondary-btn {
            height: 48px;
            border-radius: 999px;
            padding: 0 22px;
            font-size: 14px;
            font-weight: 800;
            cursor: pointer;
            font-family: inherit
        }

        .primary-btn {
            border: 0;
            background: var(--primary);
            color: #fff;
            box-shadow: 0 12px 22px rgba(31, 94, 255, .18)
        }

        .primary-btn:hover {
            background: var(--primary2)
        }

        .secondary-btn {
            background: #fff;
            color: var(--muted);
            border: 1px solid var(--line)
        }

        .verify-panel {
            margin-top: 16px;
            padding: 18px;
            border: 1px solid var(--line);
            border-radius: 22px;
            background: #fff;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 18px
        }

        .verify-left {
            display: flex;
            align-items: center;
            gap: 12px;
            min-width: 0
        }

        .circle {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            display: grid;
            place-items: center;
            background: #f1f4f9;
            color: var(--subtle);
            flex: 0 0 auto
        }

        .circle:before {
            content: "…";
            font-size: 22px
        }

        .verify-left strong {
            display: block;
            font-size: 15px;
            margin-bottom: 3px
        }

        .verify-left span {
            display: block;
            color: var(--muted);
            font-size: 13px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            max-width: 360px
        }

        .verify-btn {
            height: 44px;
            padding: 0 18px;
            border-radius: 999px;
            border: 0;
            font-family: inherit;
            font-size: 14px;
            font-weight: 800;
            background: #eef1f6;
            color: #8a95a6;
            cursor: not-allowed;
            white-space: nowrap
        }

        .verify-panel.ready .circle {
            background: var(--gsoft);
            color: var(--green)
        }

        .verify-panel.ready .circle:before {
            content: "✓"
        }

        .verify-panel.ready .verify-btn {
            background: var(--primary);
            color: #fff;
            cursor: pointer
        }

        .info-grid {
            display: grid;
            grid-template-columns:repeat(3, 1fr);
            gap: 14px;
            margin-top: 22px
        }

        .info-card {
            background: #fff;
            border: 1px solid var(--line);
            border-radius: 20px;
            padding: 18px;
            display: flex;
            gap: 12px;
            align-items: flex-start
        }

        .info-card .info-icon {
            width: 34px;
            height: 34px;
            border-radius: 12px;
            background: var(--psoft);
            color: var(--primary);
            display: grid;
            place-items: center;
            flex: 0 0 auto;
            font-weight: 800
        }

        .info-card strong {
            display: block;
            font-size: 14px;
            margin-bottom: 5px
        }

        .info-card p {
            margin: 0;
            color: var(--muted);
            font-size: 13px;
            line-height: 1.55
        }

        footer {
            text-align: center;
            color: var(--subtle);
            font-size: 12px;
            letter-spacing: .08em;
            padding: 0 28px 34px;
            text-transform: uppercase
        }

        @media (max-width: 860px) {
            .hero {
                grid-template-columns:1fr;
                gap: 28px
            }

            .info-grid {
                grid-template-columns:1fr
            }

            .page {
                padding-top: 36px
            }
        }

        @media (max-width: 560px) {
            .topbar-inner {
                padding: 0 18px
            }

            .user-area span {
                display: none
            }

            .page {
                padding: 30px 18px 42px
            }

            .upload-card {
                padding: 18px;
                border-radius: 24px
            }

            .upload-header {
                align-items: flex-start;
                flex-direction: column
            }

            .dropzone {
                min-height: 230px
            }

            .verify-panel {
                align-items: stretch;
                flex-direction: column
            }

            .verify-left span {
                max-width: 100%;
                white-space: normal
            }

            .verify-btn {
                width: 100%
            }
        }
    </style>
</head>
<body>
<nav class="topbar">
    <div class="topbar-inner">
        <div class="brand">
            <div class="brand-mark"></div>
            <span>의료 데이터 검증</span></div>
        <div class="user-area"><span>김철수 님</span>
            <button class="logout" type="button">로그아웃</button>
        </div>
    </div>
</nav>
<main class="page">
    <section class="hero">
        <div>
            <div class="eyebrow">Receiver Verification</div>
            <h1>CSV 업로드로<br>검증을 시작하세요</h1>
            <p class="lead">원본 개인정보를 직접 노출하지 않고, 암호화된 검증 과정을 통해 의료 데이터 일치 여부를 확인합니다.</p>
            <div class="meta-row"><span class="pill"><i>●</i> Encrypted request</span><span class="pill"><i>●</i> CSV only</span><span
                    class="pill"><i>●</i> Result download</span></div>
        </div>
        <section class="upload-card" aria-label="CSV upload form">
            <div class="upload-header">
                <div class="upload-title">
                    <div class="upload-icon"></div>
                    <div><h2>파일 업로드</h2>
                        <p>검증할 CSV 파일을 선택해주세요.</p>
                    </div>
                </div>
                <div class="status-badge">✓ Secure</div>
            </div>
            <label class="dropzone" id="drop-zone" for="file-input">
                <input id="file-input" type="file" accept=".csv" hidden>
                <div>
                    <div class="drop-symbol"></div>
                    <strong>파일을 끌어다 놓거나 선택하세요</strong>
                    <small>CSV 형식만 지원됩니다. 업로드 후 검증 시작 버튼이 활성화됩니다.</small>
                    <div class="button-row">
                        <button class="primary-btn" type="button" id="select-file-btn">파일 선택</button>
                        <button class="secondary-btn" type="button">샘플 양식 보기</button>
                    </div>
                </div>
            </label>
            <div class="verify-panel" id="verify-panel">
                <div class="verify-left">
                    <div class="circle"></div>
                    <div><strong id="file-state-title">파일 대기 중</strong>
                        <span id="file-state-desc">CSV 파일을 업로드하면 검증 요청을 시작할 수 있습니다.</span>
                    </div>
                </div>
                <button class="verify-btn" id="verify-btn" type="button"
                        disabled>검증 시작
                </button>
            </div>
        </section>
    </section>
</main>
<footer>Medical Data Verification Service</footer>
<script>
    const dropZone = document.getElementById('drop-zone'), fileInput = document.getElementById('file-input'),
        selectFileBtn = document.getElementById('select-file-btn'),
        verifyPanel = document.getElementById('verify-panel'), verifyBtn = document.getElementById('verify-btn'),
        fileStateTitle = document.getElementById('file-state-title'),
        fileStateDesc = document.getElementById('file-state-desc');
    selectFileBtn.addEventListener('click', e => {
        e.preventDefault();
        e.stopPropagation();
        fileInput.click()
    });
    dropZone.addEventListener('dragover', e => {
        e.preventDefault();
        dropZone.classList.add('dragover')
    });
    dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));
    dropZone.addEventListener('drop', e => {
        e.preventDefault();
        dropZone.classList.remove('dragover');
        const f = e.dataTransfer.files[0];
        if (f) handleFile(f)
    });
    fileInput.addEventListener('change', e => {
        const f = e.target.files[0];
        if (f) handleFile(f)
    });

    let selectedFile = null;
    function handleFile(file) {
        if (!file.name.toLowerCase().endsWith('.csv')) {
            fileStateTitle.textContent = 'CSV 파일만 업로드 가능합니다';
            fileStateDesc.textContent = '파일 형식을 확인한 뒤 다시 선택해주세요.';
            verifyPanel.classList.remove('ready');
            verifyBtn.disabled = true;
            selectedFile = null;
            return
        }
        fileStateTitle.textContent = '파일 선택 완료';
        fileStateDesc.textContent = file.name;
        verifyPanel.classList.add('ready');
        verifyBtn.disabled = false

        selectedFile = file;
    }

    // 검증 시작 버튼 클릭 시 백엔드 API로 파일 전송 처리
    verifyBtn.addEventListener('click', () => {
        if (!selectedFile) return;

        // 바이너리 파일 전송을 위한 FormData 객체 생성
        const formData = new FormData();
        formData.append("file", selectedFile); // 백엔드의 @RequestParam("file") 명칭과 일치해야 함

        // API 컨트롤러의 엔드포인트로 비동기 POST 전송
        fetch('/csv', {
            method: 'POST',
            body: formData
        })
            .then(response => {
                if (response.ok) {
                    // 서버가 파일 수신 및 처리를 성공하면 진행 화면으로 렌더링 이동
                    location.href = '/receiver/processing';
                } else {
                    alert('파일 업로드 및 검증 요청에 실패했습니다.');
                }
            })
            .catch(error => {
                console.error('Error:', error);
                alert('서버 통신 오류 발생');
            });
    });
</script>
</body>
</html>
