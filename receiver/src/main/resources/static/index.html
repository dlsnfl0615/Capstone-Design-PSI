<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Receiver Demo</title>
</head>
<body>
    <button onclick="preprocess()">해싱 및 윈도잉</button>
    <button onclick="sendFiles()">전송</button>
    <button onclick="checkIntersection()">교집합 찾기</button>

    <script>
        function preprocess() {
            fetch('/requests', { method: 'POST' })
                .then(res => res.text())
                .then(msg => alert(msg))
                .catch(err => alert('전송 실패: ' + err));
        }
        function sendFiles() {
            fetch('/transfers', { method: 'POST' })
                .then(res => res.text())
                .then(msg => alert(msg))
                .catch(err => alert('전송 실패: ' + err));
        }
        function checkIntersection() {
            fetch('/intersections', { method: 'POST' })
                .then(res => res.text())
                .then(msg => alert(msg))
                .catch(err => alert('전송 실패: ' + err));
        }
    </script>
</body>
</html>
