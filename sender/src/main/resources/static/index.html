<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Bin File Transfer</title>
</head>
<body>
    <button onclick="productPolynomial()">다항식 연산하기</button>
    <button onclick="sendTiming()">수행 시간 보내기</button>

<script>
    function productPolynomial() {
        fetch('/api/product', { method: 'POST' })
            .then(res => res.text())
            .then(msg => alert(msg))
            .catch(err => alert('전송 실패: ' + err));
    }
    function sendTiming() {
        fetch('/api/timing', { method: 'POST' })
            .then(res => res.text())
            .then(msg => alert(msg))
            .catch(err => alert('전송 실패: ' + err));
    }
</script>
</body>
</html>
