<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Sender Demo</title>
</head>
<body>
    <button>해싱 전처리(기능 삭제)</button>
    <button onclick="productPolynomial()">다항식 연산하기</button>
    <button onclick="sendTiming()">수행 시간 보내기</button>

<script>
    // 페이지 로드시 서버 알림 연결 통로 뚫어둠
    const eventSource = new EventSource('/connect');

    // 서버에서 complete 이벤트 신호 보내면(c++ 코드 실행 끝나면) 실행됨
    eventSource.addEventListener('complete', function(event) {
        alert("polynomial product completed: " + event.data);
    });

    function preprocess() {
        fetch('/preprocess', { method: 'POST' })
            .then(res => res.text())
            .then(msg => alert(msg))
            .catch(err => alert('전송 실패: ' + err));
    }
    function productPolynomial() {
        fetch('/polynomial', { method: 'POST' })
            .then(res => res.text())
            .then(msg => alert(msg))
            .catch(err => alert('전송 실패: ' + err));
    }
    function sendTiming() {
        fetch('/timing', { method: 'POST' })
            .then(res => res.text())
            .then(msg => alert(msg))
            .catch(err => alert('전송 실패: ' + err));
    }
</script>
</body>
</html>
